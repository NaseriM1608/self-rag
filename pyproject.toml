[project]
name = "self-rag"
version = "1.0.0"
description = "Self-reflective RAG with hybrid retrieval and GraphRAG on Neo4j"
requires-python = ">=3.10,<3.11"

[tool.pytest.ini_options]
markers = [
    "live: tests that hit the real LLM/index (deselected in CI)",
]
addopts = "-m 'not live'"
# Tests import top-level modules (chains, retriever, evals.*) regardless of
# whether pytest is invoked as `pytest`, `pytest tests`, or `python -m pytest`.
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E501 excluded: eval/test data contains long string literals where wrapping
# hurts more than it helps. Everything else stays strict.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "ISC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
