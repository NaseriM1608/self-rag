name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (mocked, no network)
        env:
          # present-but-fake keys keep config validation happy offline
          OPENROUTER_API_KEY: test-key-not-real
          NEO4J_PASSWORD: test-password-not-real
        run: pytest tests -v --cov=. --cov-report=term-missing

  # Full live evaluation against the real LLM and Neo4j — manual or nightly.
  live-eval:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Sync index + build KG
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: testpassword
        run: |
          python -c "from neo4j_store import sync_neo4j_index; print(sync_neo4j_index())"
          python -c "import kg; print(kg.build_knowledge_graph())"
      - name: Retrieval evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: testpassword
        run: |
          python -m evals.run_retrieval --variant hybrid
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
